name: Apply DP partition to real DistilGPT2 actors
on:
  push:
    paths:
      - '.github/workflows/research-partition.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      HF_HUB_DISABLE_XET: '1'
      TOKENIZERS_PARALLELISM: 'false'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --prefer-binary torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --prefer-binary -r research/requirements.txt
      - name: Confirm all model-independent tests
        run: python -m unittest discover -s research/tests -v
      - name: Run even layer counts (baseline for allocation method)
        run: python -m research.runner --model distilbert/distilgpt2 --limit 4 --repeats 2 --warmup 1 --bounds 0,2,4,6 --output research/results/partition_equal
      - name: Run cost-model DP allocation, synthetic profile clearly labeled
        run: python -m research.runner --model distilbert/distilgpt2 --limit 4 --repeats 2 --warmup 1 --profile-json research/profiles/heterogeneous_6layer_synthetic.json --output research/results/partition_dp
      - name: Preserve all measurement data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partition-comparison-six-layer
          path: research/results/
          if-no-files-found: warn

